server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Serve clean URLs (/pricing -> pricing.html); anything unknown falls back to the homepage.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Feature pages: /features/<name> -> features-<name>.html
    location ~ ^/features/([a-z0-9-]+)/?$ {
        try_files /features-$1.html /index.html;
    }

    # Fingerprinted Vite assets can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
